[project]
name = "HealthBot"
version = "0.1.2"
description = "HealthBot Site Reliability Checker"
authors = [{ name = "Luis Tineo", email = "luis@kingletas.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
# Only packages the code actually imports. Dropped from the Poetry list because
# nothing imports them: typer, beautifulsoup4/bs4, aiodns, notifiers, python-dotenv
# (env vars are read straight from os.environ; .env is loaded by the runtime, not the app).
dependencies = [
    "requests>=2.32",
    "slack-sdk>=3.27",             # replaced the archived slackclient 2026-08-24
    "google-auth>=2.29",           # replaced the deprecated oauth2client 2026-08-24
    "google-api-python-client>=2.100",
    "redis>=5.0",
    "aiohttp>=3.9",
    "boto3>=1.34",
    "loguru>=0.7",
    "newrelic-api>=1.0.6",
    "PyYAML>=6.0",
    "twilio>=9.0",
    "Jinja2>=3.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "pydantic-settings>=2.5",
    "playwright>=1.45",
    "rsa>=4.9",                    # local_env generates the throwaway GA key with it

]

[project.scripts]
healthbot = "healthbot.healthbot:main"
healthbot-dora = "healthbot.dora:main"
healthbot-demo = "healthbot.demo:main"
healthbot-local = "healthbot.local_env:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["healthbot"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "ansible-lint>=24.0",
    "moto[cloudwatch,ec2,secretsmanager,ssm]>=5.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the IT/local docker stack up and seeded; the
# default run stays self-contained. Run them with: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs the IT/local docker stack running and seeded",
]
