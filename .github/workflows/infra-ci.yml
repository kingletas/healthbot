---
name: Infra CI

on:
  push:
    branches: [main]
    paths:
      - "IT/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "IT/**"
      - ".github/workflows/infra-ci.yml"

# One run per branch. A push that supersedes another cancels it rather than
# paying for an answer nobody will read — these are metered while the
# repository is private.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt · validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./IT/terraform
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # No credentials in CI: validate against the providers only, never the
      # backend or live state
      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: IT/terraform
          soft_fail: true

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Install the collections the playbook uses
        run: uv run ansible-galaxy collection install -r IT/ansible/requirements.yml

      - name: Lint the playbook
        run: uv run ansible-lint IT/ansible/
