---
name: HealthBot CI

on:
  push:
    branches: [main]
    paths:
      - "healthbot/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/healthbot-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "healthbot/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/healthbot-ci.yml"

# One run per branch. A push that supersedes another cancels it rather than
# paying for an answer nobody will read — these are metered while the
# repository is private.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff · pytest · build (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint with ruff
        run: uv run ruff check --output-format=github .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Install the Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Import smoke test
        run: uv run python -c "import healthbot.healthbot"

      - name: Run pytest
        run: uv run pytest -q tests/

      - name: Build the wheel
        run: uv build

      # The deployable artifact: the playbook's healthbot_wheel_glob points
      # at a downloaded copy of this instead of a wheel stored in the repo
      - name: Upload the wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthbot-wheel
          path: dist/*.whl
