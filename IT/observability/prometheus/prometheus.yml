---
global:
    scrape_interval: 15s
    evaluation_interval: 30s

rule_files:
    - /etc/prometheus/rules/*.yml

# A watched store's jobs, mounted here by store/observability.yaml; with none mounted this matches nothing.
scrape_config_files:
    - /etc/prometheus/scrape.d/*.yml

alerting:
    alertmanagers:
        - static_configs:
              - targets: ["alertmanager:9093"]

scrape_configs:
    - job_name: otel-collector
      static_configs:
          - targets: ["otel-collector:8889"]
