---
receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318

processors:
    batch: {}
    # The bot exports deltas, one run at a time; this adds them up so
    # Prometheus sees one counter that climbs instead of a new series per run.
    deltatocumulative:
        # Longer than the timer's 5m period plus its 60s RandomizedDelaySec,
        # so an ordinary gap between runs never drops the running total and
        # restarts it at zero.
        max_stale: 1h

exporters:
    prometheus:
        endpoint: 0.0.0.0:8889
        # DORA gauges arrive every ~10th run; don't let them go stale between
        # exports. This also sets how long HealthBotSilent waits before a
        # stopped bot looks absent.
        metric_expiration: 10m
    debug:
        verbosity: normal

service:
    pipelines:
        metrics:
            receivers: [otlp]
            processors: [deltatocumulative, batch]
            exporters: [prometheus]
        # Traces land in the collector log for now; a Tempo/Jaeger backend is
        # a one-exporter change here when trace browsing earns its keep
        traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]
