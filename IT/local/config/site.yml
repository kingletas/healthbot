---
# Local override for healthbot/config/site.yml, selected with
# HB_CONFIG_DIR=IT/local/config. Only this file is overridden; everything
# else (cookies, headers, slack_messages, slo) falls back to the packaged
# config, so the thresholds stay the deployed contract and only the *where*
# changes: the stub storefront in IT/local's compose stack.

base_url: http://localhost:8080/
canary_urls:
    - catalogsearch/result/?q=shirt
    - shirts.html
    - checkout
    - checkout/cart
    - customer/account/login/
    - sales/guest/form

### Alerting, deliberately identical to the deployed values, so a local run
### pages on the same contract production would.
active_users_alert: 700
web_response_alert: 3.5
app_response_alert: 800

sms_alert_message: "High alert triggered. Check Mattermost ~town-square (local stack) for details."
ga_read_only_scope: "https://www.googleapis.com/auth/analytics.readonly"

secrets_namespace_prefix: "/healthbot-sm/manager/"
