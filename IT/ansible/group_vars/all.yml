---
system_bin: /usr/local/bin
system_tmp: /tmp

######
# DevOps related tags
######
healthbot_tags:
    - systemd
    - systemd_units
    - devops
    - tools
    - monitoring
    - terraform
    - aws
    - healthbot
    - newrelic
    - alert

######
# Performance related tags
######
performance_tags:
    - tools
    - performance

ansible_user: ubuntu

system_dir: /lib/systemd/system/
service_name: HealthBot
# version-independent: the tmp name must not encode a version that drifts
# from pyproject.toml
healthbot_tmp_file: "{{ system_tmp }}/{{ service_name | lower }}.whl"
# where the deployable wheel comes from: uv build's output on the control
# machine (or a CI-downloaded artifact — override the glob to point at it).
# The old flow copied a hand-built files/healthbot.whl that drifted from the
# source; the artifact is built, never stored in the repo.
healthbot_wheel_glob: "{{ playbook_dir }}/../../dist/healthbot-*.whl"
packages:
    - fail2ban
    - curl
    - wget
    - apt-transport-https
    - ca-certificates
    - unzip
    - zip
    - tar
    - git
    - awscli
    - jq
    - redis-server

service_names:
    - timer
    - service

# Rendered into /etc/healthbot.env by the template task. These are example
# values: a deployment overrides every one of them in its own inventory.
# HB_TAG_NAME and HB_ENVIRONMENT select the EC2 fleet by tag, HB_DB_IDENTIFIER
# names the RDS cluster, and HB_SECRETS_NAME is the Secrets Manager entry the
# run credentials come from.
healthbot_env:
    HB_TAG_NAME: "EXAMPLE-WEB"
    HB_ENVIRONMENT: "Production"
    HB_DB_IDENTIFIER: "example-rds-cluster"
    HB_SECRETS_NAME: "healthbot-example-secret"
    HB_AWS_PROFILE: "default"
    # Telemetry stays off until a collector endpoint exists for this host;
    # set HB_OTEL_ENABLED: "1" and OTEL_EXPORTER_OTLP_ENDPOINT to enable
    HB_OTEL_ENABLED: "0"
