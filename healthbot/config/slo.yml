---
# Service level objectives. Targets are per-run good/total ratios over a
# 30-day window; burn-rate math lives in the Prometheus rules
# (IT/observability/prometheus/rules/slo.yml), which read these targets from
# the healthbot_slo_target metric the bot emits.
#
# The latency thresholds deliberately restate site.yml's alert values: an
# objective is a declared contract, not whatever the alert config happens to
# say this week. If they drift apart, that drift is a decision to surface.
slos:
    - name: checkout_availability
      description: The browser checkout journey completes
      target: 0.99
      signal: is_checkout_up
      kind: boolean

    - name: canary_availability
      description: All canary URLs return 200
      target: 0.995
      signal: canary_ok
      kind: boolean

    - name: web_latency
      description: Web response time under its threshold (seconds)
      target: 0.99
      signal: web_response_time
      kind: below
      threshold: 3.5

    - name: app_latency
      description: App response time under its threshold (milliseconds)
      target: 0.99
      signal: app_response_time
      kind: below
      threshold: 800

    - name: monitor_availability
      description: HealthBot itself completed the run
      target: 0.999
      signal: run_completed
      kind: boolean
