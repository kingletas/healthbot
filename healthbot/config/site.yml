---
# The shipped example. A deployment points HB_CONFIG_DIR at a directory
# holding its own site.yml; anything that directory does not carry falls back
# to this file, so an override usually only needs the values above the
# alerting block.

base_url: https://store.example.com/
search_term: "blue shirt"

# Paths the canary sweep asks for, joined onto base_url. Every one has to
# answer 200, or the run pages.
canary_urls:
    - example-category.html
    - checkout
    - checkout/cart
    - customer/account/login/
    - sales/guest/form

# Which New Relic APM application to read. Empty lists every application the
# key can see and the first is used, which is right for a single-app account.
new_relic_app_filter: ""

# Shown beside the check results in the Slack message. Leave empty for none.
logo_url: ""
logo_alt: ""

### Alerting. Each of these is an upper bound: the run pages when the reading
### reaches it. The three do not share a unit, so each one states its own.
# Google Analytics realtime users. An upper bound, so it fires on a surge.
active_users_alert: 700
# New Relic Browser response time, in seconds.
web_response_alert: 3.5
# New Relic APM response time, in milliseconds.
app_response_alert: 800

sms_alert_message: "High alert triggered. Check Slack for details."
ga_read_only_scope: "https://www.googleapis.com/auth/analytics.readonly"

secrets_namespace_prefix: "/healthbot-sm/manager/"
